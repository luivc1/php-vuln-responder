<svg xmlns="http://www.w3.org/2000/svg" width="680" height="282" viewBox="0 0 680 282" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>php-vuln-responder workflow</title>
  <desc>Six phases: intake, scan and audit, compromise check, patch, verify, then communicate and close. Read-only phases in teal, the approval-gated patch phase in coral.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="282" rx="16" fill="#FFFFFF"/>

  <g>
    <rect x="40" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="130" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Intake</text>
    <text x="130" y="81" text-anchor="middle" font-size="12" fill="#5F5E5A">Authorization and routing</text>
  </g>
  <g>
    <rect x="250" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="340" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Scan and audit</text>
    <text x="340" y="81" text-anchor="middle" font-size="12" fill="#0F6E56">Sites and servers</text>
  </g>
  <g>
    <rect x="460" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="550" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Compromise check</text>
    <text x="550" y="81" text-anchor="middle" font-size="12" fill="#0F6E56">If exposed after leak</text>
  </g>
  <g>
    <rect x="460" y="150" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
    <text x="550" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Patch</text>
    <text x="550" y="191" text-anchor="middle" font-size="12" fill="#993C1D">Approval per command</text>
  </g>
  <g>
    <rect x="250" y="150" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="340" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Verify</text>
    <text x="340" y="191" text-anchor="middle" font-size="12" fill="#0F6E56">Stale-process check</text>
  </g>
  <g>
    <rect x="40" y="150" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="130" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Comms and close</text>
    <text x="130" y="191" text-anchor="middle" font-size="12" fill="#5F5E5A">EN / ES templates</text>
  </g>

  <line x1="222" y1="68" x2="246" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="432" y1="68" x2="456" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="98" x2="550" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="458" y1="178" x2="434" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="178" x2="224" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="236" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="202" y="247" font-size="12" fill="#444441">Read-only</text>
  <rect x="330" y="236" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="352" y="247" font-size="12" fill="#444441">Changes, human approval</text>
</svg>
